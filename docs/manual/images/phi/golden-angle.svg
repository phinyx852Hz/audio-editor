<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 300' width='560' height='300'><circle cx='150' cy='150' r='115' fill='#c8a24a' fill-opacity='0.12' stroke='#c8a24a' stroke-width='1.5'/><path d='M150,150 L150.00,35.00 A115,115 0 0 1 227.68,234.80 Z' fill='#c8a24a' fill-opacity='0.55' stroke='#c8a24a'/><text x='212.2' y='125.8' text-anchor='middle' font-family='EB Garamond, Garamond, Georgia, serif' font-size='19' fill='#1a1a1c'>137.5°</text><text x='91.0' y='172.9' text-anchor='middle' font-family='EB Garamond, Garamond, Georgia, serif' font-size='19' fill='#1a1a1c'>222.5°</text><text x='310' y='70' font-family='EB Garamond, Garamond, Georgia, serif' font-size='20' font-weight='600' fill='#1a1a1c'>The golden angle</text><text x='310' y='104' font-family='EB Garamond, Garamond, Georgia, serif' font-size='17' font-weight='400' fill='#1a1a1c'>360° ÷ φ² = 137.507 764…°</text><text x='310' y='138' font-family='EB Garamond, Garamond, Georgia, serif' font-size='17' font-weight='400' fill='#1a1a1c'>= π (3 − √5) = 2.399 963… rad</text><text x='310' y='172' font-family='EB Garamond, Garamond, Georgia, serif' font-size='17' font-weight='400' fill='#1a1a1c'>222.5° : 137.5° = φ : 1</text><text x='310' y='206' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#8a8578'>Turn by it again and again and</text><text x='310' y='228' font-family='Inter, Helvetica, Arial, sans-serif' font-size='14' font-weight='400' fill='#8a8578'>no two turns ever line up.</text></svg>
