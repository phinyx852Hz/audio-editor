name: foundations

# Fails when the build brings in a repository, library, third_party folder or stock plugin,
# or Source/ credits someone else's code, without a line in docs/foundations.md.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check docs/foundations.md
        run: python3 scripts/check-foundations.py
