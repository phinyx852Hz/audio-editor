name: build

on:
  push:
  pull_request:

jobs:
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        # freetype/fontconfig/X11 headers are only needed to build JUCE's juceaide helper at configure time
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja qt6-base qt6-wayland alsa-lib jack2 \
            freetype2 fontconfig libx11 libxrandr libxinerama libxcursor libxcomposite libxext mesa
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: phinyx-arch
          path: build/phinyx_artefacts/Release/phinyx

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
