name: build

on:
  push:
  pull_request:

jobs:
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        # freetype/fontconfig/X11 headers are only needed to build JUCE's juceaide helper at configure time
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja qt6-base qt6-wayland alsa-lib libpipewire pipewire-jack \
            ladspa clap freetype2 fontconfig libx11 libxrandr libxinerama libxcursor libxcomposite libxext mesa \
            cairo libsndfile clang libxi ffmpeg taglib python rust xcb-util-wm fftw curl wget
      - uses: actions/checkout@v4
      - name: Configure
        # Fails if PipeWire was not found, since then recording would be left out
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release | tee configure.log
          ! grep -q "building without recording" configure.log
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: phinyx-arch
          path: |
            build/phinyx_artefacts/Release/phinyx
            build/stock

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libcairo2-dev libsndfile1-dev libxi-dev clang \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libtag1-dev zlib1g-dev \
            libxcb-icccm4-dev libxcb-dri2-0-dev libx11-xcb-dev libxcb1-dev libfftw3-dev libcurl4-openssl-dev
      - uses: actions/checkout@v4
      - name: Configure
        # Fails if PipeWire was not found, since then recording would be left out
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release | tee configure.log
          ! grep -q "building without recording" configure.log
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
