name: build

on:
  push:
  pull_request:

# A tag such as v0.5.0 publishes the Arch package as a GitHub release
permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        # freetype/fontconfig/X11 headers are only needed to build JUCE's juceaide helper at configure time
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja qt6-base qt6-wayland qt6-webengine alsa-lib libpipewire pipewire-jack \
            ladspa clap freetype2 fontconfig libx11 libxrandr libxinerama libxcursor libxcomposite libxext mesa \
            cairo libsndfile clang libxi ffmpeg taglib python rust xcb-util-wm fftw curl wget libusb
      - uses: actions/checkout@v4
      - name: Configure
        # Fails if PipeWire was not found, since then recording would be left out
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr | tee configure.log
          ! grep -q "building without recording" configure.log
      - name: Mirror speexdsp
        # gitlab.xiph.org (Cardinal's Rack submodule speexdsp) answers 502/504 at times; GitHub's mirror instead
        run: git config --global url."https://github.com/xiph/speexdsp.git".insteadOf "https://gitlab.xiph.org/xiph/speexdsp.git"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        # makepkg will not run as root. A tag v0.5.0 gives version 0.5.0; other builds 0.5.0.r<run>.g<commit>.
        run: |
          version=$(sed -n 's/^project(Phi VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then pkgver=${GITHUB_REF_NAME#v}; else pkgver=$version.r$GITHUB_RUN_NUMBER.g${GITHUB_SHA::7}; fi
          useradd -m builder
          chown -R builder build packaging/arch
          cd packaging/arch
          sudo -u builder PHI_BUILD_DIR="$GITHUB_WORKSPACE/build" PHI_PKGVER="$pkgver" PKGEXT=.pkg.tar.zst makepkg -p ci.PKGBUILD --nodeps
          pacman -Qlp phi-*.pkg.tar.zst | grep -E 'bin/|applications/|icons/'
      - uses: actions/upload-artifact@v4
        with:
          name: phi-arch-package
          path: packaging/arch/phi-*.pkg.tar.zst
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/arch/phi-*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: phi-arch
          path: |
            build/phi_artefacts/Release/phi
            build/stock

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libcairo2-dev libsndfile1-dev libxi-dev clang \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libavdevice-dev libtag1-dev zlib1g-dev \
            libxcb-icccm4-dev libxcb-dri2-0-dev libx11-xcb-dev libxcb1-dev libfftw3-dev libcurl4-openssl-dev libusb-1.0-0-dev
      - uses: actions/checkout@v4
      - name: Configure
        # Fails if PipeWire was not found, since then recording would be left out
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release | tee configure.log
          ! grep -q "building without recording" configure.log
      - name: Mirror speexdsp
        # gitlab.xiph.org (Cardinal's Rack submodule speexdsp) answers 502/504 at times; GitHub's mirror instead
        run: git config --global url."https://github.com/xiph/speexdsp.git".insteadOf "https://gitlab.xiph.org/xiph/speexdsp.git"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
